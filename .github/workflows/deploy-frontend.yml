name: Deploy Frontend (GH Pages)

on:
  push:
    branches: [main]
    paths: [frontend/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci --prefix frontend || npm install --prefix frontend
      - run: npm run build --prefix frontend
        env:
          # Production API base: empty in dev (Vite proxy) is replaced by
          # explicit gh-pages base via env. Keep the value in repo settings
          # when a preview domain is needed; default hard-codes the prod API.
          VITE_API_BASE_URL: https://api.khub.com.ng
          # GitHub Pages serves project sites from a subpath. Cloudflare
          # Pages serves at the root and uses the default "/", so setting
          # this here is what keeps the two hosts correct.
          VITE_BASE_PATH: /khub-frontend/
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
